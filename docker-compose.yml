version: "3.9"

services:
  api:
    build: .
    image: phdata-mle-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model
      - ./data:/app/data:ro
    restart: unless-stopped
